[project]
name = "trade-research"
version = "0.1.0"
description = "Multi-agent stock and options research assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.1.0",
    "mcp>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2.50",
    "ddgs>=9.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
